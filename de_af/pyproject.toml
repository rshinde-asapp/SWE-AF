[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "de-af"
version = "0.1.0"
description = "Autonomous Data Engineering agent node for AgentField"
requires-python = ">=3.12"
dependencies = [
    "agentfield>=0.1.9",
    "pydantic>=2.0",
    # Compatibility pin: newer SDK builds have surfaced
    # "Unknown message type: rate_limit_event" during streaming.
    "claude-agent-sdk==0.1.20",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
de-af = "de_af.app:main"
de-fast = "de_af.fast.app:main"

[tool.setuptools.packages.find]
include = ["de_af*"]
